name: Release

# Publishes a GitHub Release on immutable semver tags only (vX.Y.Z / vX.Y.Z-lts).
# Do NOT force-move floating git tags like `current` / `lts` — that breaks
# `git pull --tags` for every clone (tag clobber).
# grid-core image builds clone this repository at the same version tag.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('v{0} LTS', steps.meta.outputs.version) || format('v{0}', steps.meta.outputs.version) }}
          generate_release_notes: true
