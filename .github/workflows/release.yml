name: Release

# Publishes a GitHub Release and floating git tags on version tags.
#   Current: vX.Y.Z → tag `current`
#   LTS:     vX.Y.Z-lts → tags `current` and `lts`
# grid-core image builds clone this repository at the same tag.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Update channel tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f current "${GITHUB_SHA}"
          git push -f origin refs/tags/current
          if [[ "${{ steps.meta.outputs.is_lts }}" == "true" ]]; then
            git tag -f lts "${GITHUB_SHA}"
            git push -f origin refs/tags/lts
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('v{0} LTS', steps.meta.outputs.version) || format('v{0}', steps.meta.outputs.version) }}
          generate_release_notes: true
